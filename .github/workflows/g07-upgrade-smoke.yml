name: G07 upgrade smoke

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/g07-upgrade-smoke.yml"
      - "pyproject.toml"
      - "src/whaxon/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/g07-upgrade-smoke.yml"
      - "pyproject.toml"
      - "src/whaxon/**"

permissions:
  contents: read

jobs:
  upgrade:
    name: Upgrade installed release and preserve operator state
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build candidate wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir "$RUNNER_TEMP/candidate"

      - name: Install last published release and seed operator data
        env:
          UPGRADE_DATA: ${{ runner.temp }}/whaxon-upgrade-data
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/upgrade-env"
          "$RUNNER_TEMP/upgrade-env/bin/python" -m pip install "whaxon==0.11.16"
          "$RUNNER_TEMP/upgrade-env/bin/python" - <<'PY'
          import json
          import os
          from pathlib import Path

          from whaxon.core import Core

          data = Path(os.environ["UPGRADE_DATA"])
          core = Core(data)
          (data / "tools.json").write_text(
              json.dumps({"tools": [{
                  "id": "operator_upgrade_fixture",
                  "name": "Operator upgrade fixture",
                  "category": "test",
                  "binary": "operator-fixture-not-installed",
                  "args": "{target}",
              }]}, indent=2) + "\n",
              encoding="utf-8",
          )
          core.scope.save({
              "enabled": True,
              "engagement": "g07-upgrade-smoke",
              "in_scope": ["127.0.0.1"],
              "out_of_scope": [],
              "notes": "operator data must survive package upgrade",
          })
          core.store.create("upgrade-preserved-job")
          core.store.set_started(
              "upgrade-preserved-job", "fixture", "127.0.0.1",
          )
          core.store.append_line(
              "upgrade-preserved-job", "stdout", "pre-upgrade evidence",
          )
          core.store.set_finished("upgrade-preserved-job", 0, 0.1)
          print("Seeded user catalog, scope and legacy job state.")
          PY

      - name: Upgrade to candidate wheel and verify preserved state
        env:
          UPGRADE_DATA: ${{ runner.temp }}/whaxon-upgrade-data
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/upgrade-env/bin/python" -m pip install \
            --force-reinstall --no-deps "$RUNNER_TEMP"/candidate/*.whl
          "$RUNNER_TEMP/upgrade-env/bin/whaxon" --help >/dev/null
          "$RUNNER_TEMP/upgrade-env/bin/python" - <<'PY'
          import asyncio
          import json
          import os
          from pathlib import Path

          from whaxon.core import Core

          data = Path(os.environ["UPGRADE_DATA"])
          catalog_before = (data / "tools.json").read_bytes()
          scope_before = (data / "scope.json").read_bytes()

          core = Core(data)
          asyncio.run(core.initialize(drain=False))

          assert (data / "tools.json").read_bytes() == catalog_before
          assert core.catalog.get("operator_upgrade_fixture") is not None
          assert (data / "scope.json").read_bytes() == scope_before
          scope = core.scope.summary()
          assert scope["engagement"] == "g07-upgrade-smoke"
          assert scope["in_scope"] == ["127.0.0.1"]

          job = core.store.get("upgrade-preserved-job")
          assert job["status"] == "finished"
          assert [line["text"] for line in job["lines"]] == [
              "pre-upgrade evidence",
          ]

          core.create_mission(
              "upgrade-created-v2-mission",
              "verify current Engine V2 schema initializes after upgrade",
          )
          assert core.store.get_mission("upgrade-created-v2-mission") is not None
          print("Upgrade preserved operator catalog, scope and job history.")
          print("Post-upgrade Engine V2 mission storage initialized.")
          PY
