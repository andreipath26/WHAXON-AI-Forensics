name: One-time stale branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[branch-cleanup-2026-10-28]')
    runs-on: ubuntu-latest
    steps:
      - name: Delete only audited, unchanged, obsolete branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          refs="$(gh api "repos/$repo/git/matching-refs/heads")"

          # Each entry is an audited branch name plus its exact observed head SHA.
          # Any moved branch is skipped. main and the experiment branch are never targets.
          while read -r branch expected; do
            [[ -z "${branch:-}" ]] && continue
            [[ "$branch" == "main" || "$branch" == "publish/whaxon-experiment-2026-10-25" ]] && {
              echo "PROTECTED: $branch"
              continue
            }
            actual="$(jq -r --arg ref "refs/heads/$branch" '.[] | select(.ref == $ref) | .object.sha' <<< "$refs")"
            if [[ -z "$actual" ]]; then
              echo "ALREADY ABSENT: $branch"
              continue
            fi
            if [[ "$actual" != "$expected" ]]; then
              echo "SKIP MOVED BRANCH: $branch expected=$expected actual=$actual"
              continue
            fi
            open_prs="$(gh pr list --repo "$repo" --head "$branch" --state open --json number --jq 'length')"
            if [[ "$open_prs" != "0" ]]; then
              echo "SKIP OPEN PR: $branch"
              continue
            fi
            encoded="${branch//\//%2F}"
            gh api --method DELETE "repos/$repo/git/refs/heads/$encoded"
            echo "DELETED: $branch ($actual)"
          done <<'BRANCHES'
