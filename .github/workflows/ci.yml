name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# Preserve in-flight validation when commits arrive close together. Each
# pushed commit must retain its own CI result; do not silently cancel it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  engine-v2-e5-systemd-deployment:
    name: Engine V2 E5 real systemd host smoke (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install wheel on isolated host and provision service account
        timeout-minutes: 12
        run: |
          set -euo pipefail
          python -m pip install build
          python -m build --wheel
          sudo useradd --system --home /opt/whaxon --shell /usr/sbin/nologin whaxon
          sudo mkdir -p /opt/whaxon /var/lib/whaxon/data
          sudo chown -R whaxon:whaxon /opt/whaxon /var/lib/whaxon
          sudo python3 -m venv /opt/whaxon/.venv
          sudo /opt/whaxon/.venv/bin/pip install "$(echo dist/*.whl)[web]"
          printf '%s\n' 'WHAXON_AUTH_USER=ci-operator' \
            'WHAXON_AUTH_PASS=ci-unique-secret-not-for-production-use' | sudo tee /etc/whaxon.env >/dev/null
          sudo chmod 0600 /etc/whaxon.env
          sudo install -m 0644 whaxon.service whaxon-workflow-worker.service /etc/systemd/system/
          sudo systemctl daemon-reload
      - name: Start both services and prove shared state survives supervised restart
        timeout-minutes: 6
        run: |
          set -euo pipefail
          sudo systemctl start whaxon-workflow-worker.service whaxon.service
          python - <<'PY'
          import base64
          import json
          import time
          import urllib.request

          credentials = base64.b64encode(
              b"ci-operator:ci-unique-secret-not-for-production-use"
          ).decode()
          deadline = time.monotonic() + 90
          while time.monotonic() < deadline:
              try:
                  req = urllib.request.Request(
                      "http://127.0.0.1:5001/api/health",
                      headers={"Authorization": f"Basic {credentials}"},
                  )
                  with urllib.request.urlopen(req, timeout=4) as response:
                      state = json.load(response)
                  if state["core_ready"] is True:
                      break
              except (OSError, KeyError, ValueError):
                  pass
              time.sleep(2)
          else:
              raise SystemExit("systemd web Core readiness did not become true")
          assert state["worker_liveness_verified"] is False if "worker_liveness_verified" in state else True
          PY
          sudo systemctl is-active --quiet whaxon.service
          sudo systemctl is-active --quiet whaxon-workflow-worker.service
          sudo -u whaxon env WHAXON_DATA=/var/lib/whaxon/data \
            /opt/whaxon/.venv/bin/whaxon workflow mission create \
              --id systemd-e5-durable --objective "inert systemd persistence" > e5-systemd-created.json
          sudo systemctl restart whaxon-workflow-worker.service whaxon.service
          sudo systemctl is-active --quiet whaxon.service
          sudo systemctl is-active --quiet whaxon-workflow-worker.service
          sudo -u whaxon env WHAXON_DATA=/var/lib/whaxon/data \
            /opt/whaxon/.venv/bin/whaxon workflow mission list > e5-systemd-restored.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("e5-systemd-restored.json").read_text())
          assert any(row["id"] == "systemd-e5-durable" for row in data), data
          PY
      - name: Stop paired services, snapshot complete state and verify isolated restore
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo systemctl stop whaxon.service whaxon-workflow-worker.service
          sudo -u whaxon /opt/whaxon/.venv/bin/python - <<'PY'
          from pathlib import Path
          from whaxon.core import Core
          from whaxon.core.state_snapshot import (
              create_offline_snapshot, restore_offline_snapshot, verify_offline_snapshot,
          )
          source = Path("/var/lib/whaxon/data")
          snapshot = Path("/var/lib/whaxon/e5-ci-backup")
          destination = Path("/var/lib/whaxon/e5-ci-restored")
          report = create_offline_snapshot(source, snapshot)
          assert report["files_verified"]
          anchor = report["manifest_sha256"]
          assert verify_offline_snapshot(
              snapshot, expected_manifest_sha256=anchor,
          )["external_anchor_verified"]
          restore_offline_snapshot(
              snapshot, destination, expected_manifest_sha256=anchor,
          )
          restored = Core(destination)
          assert any(
              row["id"] == "systemd-e5-durable"
              for row in restored.missions()
          )
          print("Systemd host offline restore verified; independent anchor not deployed")
          PY
      - name: Collect diagnostics on failure
        if: failure()
        run: |
          sudo systemctl --no-pager status whaxon.service whaxon-workflow-worker.service || true
          sudo journalctl --no-pager -u whaxon.service -u whaxon-workflow-worker.service -n 70 || true
      - name: Stop services and remove CI secrets
        if: always()
        run: |
          sudo systemctl stop whaxon.service whaxon-workflow-worker.service || true
          sudo rm -f /etc/whaxon.env

  engine-v2-e5-docker-deployment:
    name: Engine V2 E5 paired Docker web-worker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WHAXON_AUTH_USER: ci-operator
      WHAXON_AUTH_PASS: ci-only-example-long-unique-secret-not-for-deployment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate isolated E5 Compose configuration
        run: docker compose -f docker-compose.e5.yml config --quiet
      - name: Build and start both supervised E5 services
        timeout-minutes: 22
        run: docker compose -f docker-compose.e5.yml up -d --build
      - name: Verify web readiness, worker CLI and shared persistent state
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          credentials = f"{os.environ['WHAXON_AUTH_USER']}:{os.environ['WHAXON_AUTH_PASS']}"
          value = base64.b64encode(credentials.encode()).decode()
          url = "http://127.0.0.1:5001/api/health"
          deadline = time.monotonic() + 90
          while time.monotonic() < deadline:
              try:
                  request = urllib.request.Request(url, headers={"Authorization": f"Basic {value}"})
                  with urllib.request.urlopen(request, timeout=3) as response:
                      data = json.load(response)
                  if data.get("core_ready") is True:
                      break
              except (OSError, ValueError, urllib.error.HTTPError):
                  pass
              time.sleep(2)
          else:
              raise SystemExit("paired E5 web service did not become Core-ready")
          print("Web Core-ready (not a worker-liveness guarantee)")
          PY
          docker compose -f docker-compose.e5.yml exec -T workflow-worker \
            whaxon workflow plan queue-summary > e5-queue-before.json
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path("e5-queue-before.json").read_text())
          assert state["worker_liveness_verified"] is False
          assert state["automatic_uncertain_replay"] is False
          PY
          # Create one inert mission through the worker CLI. Its metadata
          # must be visible from the independent web container after restart,
          # proving both services use the same durable state volume.
          docker compose -f docker-compose.e5.yml exec -T workflow-worker \
            whaxon workflow mission create --id e5-ci-shared-state --objective "inert persistence check" > e5-mission-created.json
          docker compose -f docker-compose.e5.yml exec -T web \
            whaxon workflow mission list > e5-missions-before.json
          python - <<'PY'
          import json
          from pathlib import Path
          created = json.loads(Path("e5-mission-created.json").read_text())
          missions = json.loads(Path("e5-missions-before.json").read_text())
          assert created["mission_id"] == "e5-ci-shared-state"
          assert any(row["id"] == "e5-ci-shared-state" for row in missions)
          PY
          # Prove the independent worker really processes a persisted V2
          # request end-to-end. An unregistered fixture capability is blocked
          # without launching a scanner or touching an external target.
          docker compose -f docker-compose.e5.yml exec -T web python - <<'PY'
          import json
          from pathlib import Path
          from whaxon.core import Core
          from whaxon.core.workflow import WorkflowPlan, WorkflowTask
          core = Core(Path("/data"))
          core.create_mission("e5-ci-no-external-effects", "safe durable worker smoke")
          core.save_workflow_plan(
              "e5-ci-no-external-effects-plan",
              WorkflowPlan(
                  "e5-ci-no-external-effects",
                  (WorkflowTask("unsupported", "unsupported.fixture", "192.0.2.10"),),
              ),
          )
          request = core.enqueue_workflow_run("e5-ci-no-external-effects-plan")
          assert request["status"] == "queued"
          assert "lease_token" not in request
          print(json.dumps({"submitted": request["id"]}))
          PY
          docker compose -f docker-compose.e5.yml exec -T web python - <<'PY'
          import time
          from pathlib import Path
          from whaxon.core import Core
          core = Core(Path("/data"))
          deadline = time.monotonic() + 60
          while time.monotonic() < deadline:
              progress = core.workflow_progress("e5-ci-no-external-effects-plan")
              if progress["counts"].get("blocked", 0) == 1:
                  break
              time.sleep(0.5)
          else:
              raise SystemExit("durable E5 worker did not process inert blocked task")
          assert progress["counts"].get("succeeded", 0) == 0
          print("Independent E5 worker processed a safe blocked task")
          PY
          docker compose -f docker-compose.e5.yml restart workflow-worker
          docker compose -f docker-compose.e5.yml exec -T web \
            whaxon workflow mission list > e5-missions-after.json
          python - <<'PY'
          import json
          from pathlib import Path
          missions = json.loads(Path("e5-missions-after.json").read_text())
          assert any(row["id"] == "e5-ci-shared-state" for row in missions)
          PY
          docker compose -f docker-compose.e5.yml exec -T workflow-worker \
            whaxon workflow plan queue-summary > e5-queue-after.json
          python - <<'PY'
          import json
          from pathlib import Path
          before = json.loads(Path("e5-queue-before.json").read_text())
          after = json.loads(Path("e5-queue-after.json").read_text())
          assert before["schema_version"] == after["schema_version"]
          assert after["worker_liveness_verified"] is False
          assert after["automatic_uncertain_replay"] is False
          PY
      - name: Offline E5 state backup, verified restore and mission recovery
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # Quiesce both services. A new one-shot container reads the existing
          # state volume but never runs the V2 worker loop or any scanner.
          docker compose -f docker-compose.e5.yml stop web workflow-worker
          docker compose -f docker-compose.e5.yml run --rm --no-deps -T \
            -v e5-backups:/e5-backups workflow-worker \
            python -m whaxon.core.state_snapshot backup /data /e5-backups/snapshot \
            > e5-snapshot-result.json
          manifest_sha="$(python -c 'import json; print(json.load(open("e5-snapshot-result.json"))["manifest_sha256"])')"
          docker compose -f docker-compose.e5.yml run --rm --no-deps -T \
            -v e5-backups:/e5-backups workflow-worker \
            python -m whaxon.core.state_snapshot verify /e5-backups/snapshot \
            --expected-manifest-sha256 "$manifest_sha" > e5-verify-result.json
          docker compose -f docker-compose.e5.yml run --rm --no-deps -T \
            -v e5-backups:/e5-backups workflow-worker \
            python -m whaxon.core.state_snapshot restore \
            /e5-backups/snapshot /e5-backups/restored \
            --expected-manifest-sha256 "$manifest_sha" > e5-restore-result.json
          docker compose -f docker-compose.e5.yml run --rm --no-deps -T \
            -v e5-backups:/e5-backups workflow-worker \
            whaxon workflow --data-dir /e5-backups/restored mission list \
            > e5-restored-missions.json
          python - <<'PY'
          import json
          from pathlib import Path
          verified = json.loads(Path("e5-verify-result.json").read_text())
          restored = json.loads(Path("e5-restore-result.json").read_text())
          missions = json.loads(Path("e5-restored-missions.json").read_text())
          assert verified["files_verified"] and restored["files_verified"]
          assert verified["external_anchor_verified"] is True
          assert restored["external_anchor_verified"] is True
          assert any(m["id"] == "e5-ci-shared-state" for m in missions)
          PY
      - name: Capture service diagnostics on failure
        if: failure()
        run: |
          docker compose -f docker-compose.e5.yml ps || true
          docker compose -f docker-compose.e5.yml logs --tail=80 || true
      - name: Tear down without deleting evidence volume
        if: always()
        run: docker compose -f docker-compose.e5.yml down || true

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # PDF and CLI ergonomics tests expect these dependencies on every matrix version.
      # Bound network waits and retry transient Ubuntu mirror failures.
      - name: Install system deps (pandoc, weasyprint)
        timeout-minutes: 7
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eu
          # Bound network waits and retry transient Ubuntu mirror failures.
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends pandoc weasyprint

      - name: Install (core + dev)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[tui,web,dev]"

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Boundary check — enforced by tests/test_ai_boundary.py
        run: python -m pytest tests/test_ai_boundary.py -v

      - name: Ruff
        run: ruff check src tests

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: python -m pytest tests/ -q -ra

      - name: Build distributions and validate metadata
        run: |
          python -m build
          python -m twine check dist/*

      - name: Verify source distribution includes runtime data and payloads
        if: matrix.python-version == '3.12'
        run: |
          python - <<'PY'
          import tarfile
          from pathlib import Path

          archives = list(Path("dist").glob("*.tar.gz"))
          assert len(archives) == 1, f"expected one source archive, found {len(archives)}"
          with tarfile.open(archives[0], "r:gz") as archive:
              names = archive.getnames()
          assert any(name.endswith("/src/whaxon/data/dependencies.json") for name in names), (
              "sdist is missing the dependency manifest"
          )
          assert any(name.endswith("/src/whaxon/data/tools.json") for name in names), (
              "sdist is missing the external-tool catalog"
          )
          assert any(
              "/src/whaxon/data/payloads/" in name and not name.endswith("/")
              for name in names
          ), "sdist contains no validation payload files"
          print("Source distribution contains the dependency manifest, tool catalog and payloads.")
          PY

      - name: Smoke-test built wheel in a clean environment
        if: matrix.python-version == '3.12'
        run: |
          set -eu
          python -m venv /tmp/whaxon-ci-smoke
          /tmp/whaxon-ci-smoke/bin/python -m pip install --upgrade pip
          /tmp/whaxon-ci-smoke/bin/python -m pip install dist/*.whl
          /tmp/whaxon-ci-smoke/bin/whaxon --help
          /tmp/whaxon-ci-smoke/bin/whaxon doctor --json > doctor-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("doctor-report.json").read_text(encoding="utf-8"))
          assert report["schema_version"] == 1
          assert report["summary"]["required_blockers"] == 0
          payloads = next(
              item for item in report["dependencies"] if item["id"] == "validation-payloads"
          )
          assert payloads["status"] == "READY", payloads
          PY
          SMOKE_DATA="$(mktemp -d)"
          /tmp/whaxon-ci-smoke/bin/whaxon scope --show --data "$SMOKE_DATA"
          SMOKE_DATA="$SMOKE_DATA" /tmp/whaxon-ci-smoke/bin/python - <<'PY'
          import json
          import os
          from importlib.resources import files
          from pathlib import Path

          package = files("whaxon")
          packaged_catalog = package.joinpath("data", "tools.json")
          payloads = package.joinpath("data", "payloads")
          assert packaged_catalog.is_file(), "wheel is missing whaxon/data/tools.json"
          packaged_data = json.loads(packaged_catalog.read_text(encoding="utf-8"))
          assert isinstance(packaged_data, (dict, list)), "packaged tools catalog has invalid JSON shape"
          assert payloads.is_dir(), "wheel is missing whaxon/data/payloads"
          assert any(payloads.iterdir()), "wheel contains no validation payload files"

          user_catalog = Path(os.environ["SMOKE_DATA"]) / "tools.json"
          assert user_catalog.is_file(), "Core did not seed the user catalog from the installed package"
          user_data = json.loads(user_catalog.read_text(encoding="utf-8"))
          tools = user_data.get("tools", []) if isinstance(user_data, dict) else user_data
          assert isinstance(tools, list) and tools, "seeded tool catalog is empty or malformed"
          # Exercise scope policy and a real, non-destructive HTTP observation
          # through the installed wheel against an ephemeral localhost server.
          import threading
          from http.server import BaseHTTPRequestHandler, HTTPServer
          from whaxon.core.findings import Finding
          from whaxon.core.scope import ScopeManager
          from whaxon.core.validator import Validator

          scope = ScopeManager(Path(os.environ["SMOKE_DATA"]) / "scope.json")
          assert scope.check("127.0.0.1").allowed, "loopback should be in the default scope"
          assert not scope.check("8.8.8.8").allowed, "public IP must be denied by default"

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  body = b"ok"
                  self.send_response(200)
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *args):
                  pass

          server = HTTPServer(("127.0.0.1", 0), Handler)
          thread = threading.Thread(target=server.serve_forever, daemon=True)
          thread.start()
          try:
              url = f"http://127.0.0.1:{server.server_address[1]}/"
              finding = Finding(
                  kind="http_header_missing", severity="low", source="smoke",
                  data={"header": "Content-Security-Policy", "url": url},
                  raw_line="missing CSP",
              )
              payload_dir = Path(str(files("whaxon").joinpath("data", "payloads")))
              status, reason = Validator(payload_dir).validate(finding, target_url=url)
              assert status == "verified", f"installed-wheel HTTP observation failed: {reason}"
          finally:
              server.shutdown()
              server.server_close()

          print("Installed-wheel CLI, catalog, scope, payload, and HTTP validation smoke tests passed.")
          PY


  setup-platform-smoke:
    name: setup smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m pip install dist/*.whl
      - name: Verify first-run preview and venv bootstrap
        shell: bash
        run: |
          set -eu
          whaxon setup --profile core --json > setup-plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path("setup-plan.json").read_text(encoding="utf-8"))
          assert plan["profile"] == "core"
          assert plan["execution"]["commands_executed"] is False
          assert plan["execution"]["network_accessed"] is False
          assert plan["execution"]["privilege_escalation_attempted"] is False
          assert plan["dependency_plan"]["plan_id"].startswith("plan-")
          PY
          whaxon setup --create-venv --venv-path .ci-setup-venv
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(".ci-setup-venv")
          assert (root / ("Scripts/python.exe" if os.name == "nt" else "bin/python")).is_file()
          PY


  headless-server-smoke:
    name: headless Linux server (no display)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build and install WHAXON web wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m pip install "dist/$(ls dist/*.whl | xargs basename)[web]"
      - name: Exercise CLI setup and doctor with all display/session variables removed
        env:
          DISPLAY: ""
          WAYLAND_DISPLAY: ""
          XDG_SESSION_TYPE: ""
          QT_QPA_PLATFORM: "offscreen"
          TERM: "dumb"
        run: |
          set -euo pipefail
          unset DISPLAY WAYLAND_DISPLAY XDG_SESSION_TYPE
          whaxon --help
          whaxon setup --profile core --json > headless-plan.json
          whaxon doctor --core-only --json > headless-doctor.json
          python - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path("headless-plan.json").read_text(encoding="utf-8"))
          doctor = json.loads(Path("headless-doctor.json").read_text(encoding="utf-8"))
          assert plan["execution"]["commands_executed"] is False
          assert plan["execution"]["network_accessed"] is False
          assert doctor["schema_version"] == 1
          assert doctor["summary"]["required_blockers"] == 0, doctor["summary"]
          PY
      - name: Start production Waitress server without a TTY or display
        env:
          DISPLAY: ""
          WAYLAND_DISPLAY: ""
          XDG_SESSION_TYPE: ""
          QT_QPA_PLATFORM: "offscreen"
          TERM: "dumb"
        run: |
          unset DISPLAY WAYLAND_DISPLAY XDG_SESSION_TYPE
          python - <<'PY'
          import os
          import shutil
          import socket
          import subprocess
          import time
          import urllib.error
          import urllib.request

          executable = shutil.which("whaxon")
          assert executable, "whaxon console script is not installed"
          with socket.socket() as probe:
              probe.bind(("127.0.0.1", 0))
              port = probe.getsockname()[1]
          env = os.environ.copy()
          env.pop("DISPLAY", None)
          env.pop("WAYLAND_DISPLAY", None)
          env.pop("XDG_SESSION_TYPE", None)
          env["WHAXON_DATA"] = os.path.abspath(".headless-whaxon-data")
          process = subprocess.Popen(
              [executable, "serve", "--host", "127.0.0.1", "--port", str(port), "--threads", "2"],
              env=env, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT, text=True,
          )
          try:
              deadline = time.monotonic() + 20
              response = None
              last_error = None
              while time.monotonic() < deadline:
                  if process.poll() is not None:
                      output = process.stdout.read() if process.stdout else ""
                      raise AssertionError(f"headless Waitress server exited {process.returncode}: {output}")
                  try:
                      response = urllib.request.urlopen(f"http://127.0.0.1:{port}/", timeout=2)
                      break
                  except urllib.error.HTTPError as exc:
                      response = exc
                      break
                  except (OSError, TimeoutError) as exc:
                      last_error = exc
                      time.sleep(0.25)
              assert response is not None, f"headless server did not accept HTTP: {last_error}"
              assert response.status in (200, 302, 401), response.status
              print(f"Headless Waitress server returned HTTP {response.status}.")
          finally:
              process.terminate()
              try:
                  process.wait(timeout=10)
              except subprocess.TimeoutExpired:
                  process.kill()
                  process.wait(timeout=5)
          PY

  setup-external-tool-smoke:
    name: curated apt tool installation smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Refresh apt metadata
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
      - name: Build and install WHAXON wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m pip install dist/*.whl
      - name: Preview and explicitly approve curated external tools
        run: |
          set -euo pipefail
          whaxon setup --profile core --tool nmap --tool gobuster --tool sqlmap --tool ffuf --json > tool-plan.json
          PLAN_ID="$(python -c 'import json; print(json.load(open("tool-plan.json", encoding="utf-8"))["external_tool_plan"]["plan_id"])')"
          set +e
          whaxon setup --profile core --tool nmap --tool gobuster --tool sqlmap --tool ffuf --install-tools --approve-tools "$PLAN_ID" --allow-system-changes --allow-elevation --json > tool-install.json
          INSTALL_RC=$?
          set -e
          if [[ "$INSTALL_RC" -ne 0 ]]; then
            cat tool-install.json
            echo "Gobuster --version output:"
            gobuster --version || true
            echo "Gobuster version subcommand output:"
            gobuster version || true
            whaxon doctor --verify --json > doctor-report.json
            python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("doctor-report.json").read_text(encoding="utf-8"))
          gobuster = next(item for item in report["dependencies"] if item["id"] == "gobuster")
          print(json.dumps(gobuster, indent=2))
          PY
            exit "$INSTALL_RC"
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("tool-install.json").read_text(encoding="utf-8"))
          installation = result["external_tool_installation"]
          assert installation["status"] == "VERIFIED", installation
          completed = set(installation.get("installed", [])) | set(installation.get("already_present", []))
          assert completed == {"nmap", "gobuster", "sqlmap", "ffuf"}, installation
          assert installation["network_accessed"] is True
          PY
      - name: Verify curated executables and run a loopback-only scanner smoke test
        run: |
          set -euo pipefail
          whaxon doctor --verify --json > verified-tools.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("verified-tools.json").read_text(encoding="utf-8"))
          states = {
              item["id"]: item["status"]
              for item in report["dependencies"]
              if item["kind"] == "external-tool"
          }
          expected = {"nmap", "gobuster", "sqlmap", "ffuf"}
          assert all(states.get(tool) == "READY" for tool in expected), states
          PY
          nmap -sn -n 127.0.0.1
          python tests/smoke_external_tools.py

