name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps (pandoc, weasyprint)
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc weasyprint

      - name: Install (core + dev)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[tui,web,dev]"

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Boundary check — enforced by tests/test_ai_boundary.py
        run: python -m pytest tests/test_ai_boundary.py -v

      - name: Ruff
        run: ruff check src tests

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: python -m pytest tests/ -q

      - name: Build distributions and validate metadata
        run: |
          python -m build
          python -m twine check dist/*

      - name: Smoke-test built wheel in a clean environment
        if: matrix.python-version == '3.12'
        run: |
          set -eu
          python -m venv /tmp/whaxon-ci-smoke
          /tmp/whaxon-ci-smoke/bin/python -m pip install --upgrade pip
          /tmp/whaxon-ci-smoke/bin/python -m pip install dist/*.whl
          /tmp/whaxon-ci-smoke/bin/whaxon --help
          SMOKE_DATA="$(mktemp -d)"
          /tmp/whaxon-ci-smoke/bin/whaxon scope --show --data "$SMOKE_DATA"
          SMOKE_DATA="$SMOKE_DATA" /tmp/whaxon-ci-smoke/bin/python - <<'PY'
          import json
          import os
          from importlib.resources import files
          from pathlib import Path

          package = files("whaxon")
          packaged_catalog = package.joinpath("data", "tools.json")
          payloads = package.joinpath("data", "payloads")
          assert packaged_catalog.is_file(), "wheel is missing whaxon/data/tools.json"
          packaged_data = json.loads(packaged_catalog.read_text(encoding="utf-8"))
          assert isinstance(packaged_data, (dict, list)), "packaged tools catalog has invalid JSON shape"
          assert payloads.is_dir(), "wheel is missing whaxon/data/payloads"
          assert any(payloads.iterdir()), "wheel contains no validation payload files"

          user_catalog = Path(os.environ["SMOKE_DATA"]) / "tools.json"
          assert user_catalog.is_file(), "Core did not seed the user catalog from the installed package"
          user_data = json.loads(user_catalog.read_text(encoding="utf-8"))
          tools = user_data.get("tools", []) if isinstance(user_data, dict) else user_data
          assert isinstance(tools, list) and tools, "seeded tool catalog is empty or malformed"
          # Exercise scope policy and a real, non-destructive HTTP observation
          # through the installed wheel against an ephemeral localhost server.
          import threading
          from http.server import BaseHTTPRequestHandler, HTTPServer
          from whaxon.core.findings import Finding
          from whaxon.core.scope import ScopeManager
          from whaxon.core.validator import Validator

          scope = ScopeManager(Path(os.environ["SMOKE_DATA"]) / "scope.json")
          assert scope.check("127.0.0.1").allowed, "loopback should be in the default scope"
          assert not scope.check("8.8.8.8").allowed, "public IP must be denied by default"

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  body = b"ok"
                  self.send_response(200)
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *args):
                  pass

          server = HTTPServer(("127.0.0.1", 0), Handler)
          thread = threading.Thread(target=server.serve_forever, daemon=True)
          thread.start()
          try:
              url = f"http://127.0.0.1:{server.server_address[1]}/"
              finding = Finding(
                  kind="http_header_missing", severity="low", source="smoke",
                  data={"header": "Content-Security-Policy", "url": url},
                  raw_line="missing CSP",
              )
              payload_dir = Path(str(files("whaxon").joinpath("data", "payloads")))
              status, reason = Validator(payload_dir).validate(finding, target_url=url)
              assert status == "verified", f"installed-wheel HTTP observation failed: {reason}"
          finally:
              server.shutdown()
              server.server_close()

          print("Installed-wheel CLI, catalog, scope, payload, and HTTP validation smoke tests passed.")
          PY
