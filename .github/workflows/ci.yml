name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps (pandoc, weasyprint)
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc weasyprint

      - name: Install (core + dev)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[tui,web,dev]"

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Boundary check — enforced by tests/test_ai_boundary.py
        run: python -m pytest tests/test_ai_boundary.py -v

      - name: Ruff
        run: ruff check src tests

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: python -m pytest tests/ -q

      - name: Build distributions and validate metadata
        run: |
          python -m build
          python -m twine check dist/*

      - name: Smoke-test built wheel in a clean environment
        if: matrix.python-version == '3.12'
        run: |
          set -eu
          python -m venv /tmp/whaxon-ci-smoke
          /tmp/whaxon-ci-smoke/bin/python -m pip install --upgrade pip
          /tmp/whaxon-ci-smoke/bin/python -m pip install dist/*.whl
          /tmp/whaxon-ci-smoke/bin/whaxon --help
          /tmp/whaxon-ci-smoke/bin/python - <<'PY'
          import json
          from importlib.resources import files

          package = files("whaxon")
          catalog = package.joinpath("data", "tools.json")
          payloads = package.joinpath("data", "payloads")
          assert catalog.is_file(), "wheel is missing whaxon/data/tools.json"
          data = json.loads(catalog.read_text(encoding="utf-8"))
          assert isinstance(data, (dict, list)), "packaged tools catalog has invalid JSON shape"
          assert payloads.is_dir(), "wheel is missing whaxon/data/payloads"
          assert any(payloads.iterdir()), "wheel contains no validation payload files"
          print("Built wheel package-data smoke test passed.")
          PY
