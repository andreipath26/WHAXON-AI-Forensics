name: Dashboard visual and focused acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "src/whaxon/interfaces/web/templates/ui_v2_dashboard.html"
      - "tests/test_web_ui_v2_dashboard.py"
      - "tests/test_web_ui_v2_dashboard_visual.py"
      - "tests/test_v2_ui_mandatory_crosswalk.py"
      - "docs/V2_UI_MANDATORY_CROSSWALK.md"
      - ".github/workflows/dashboard-visual-review.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Dashboard test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[web,dev]"
          python -m playwright install --with-deps chromium
      - name: Install automated accessibility audit
        run: npm install --no-save --ignore-scripts --no-audit --no-fund axe-core@4.10.3
      - name: Browser regressions and crosswalk
        run: python -m pytest -q -ra tests/test_web_ui_v2_dashboard.py tests/test_v2_ui_mandatory_crosswalk.py
      - name: Capture desktop and mobile screenshot candidates
        run: python -m pytest -q -ra tests/test_web_ui_v2_dashboard_visual.py
      - name: Automated desktop/mobile WCAG audit
        run: python -m pytest -q -ra tests/test_web_ui_v2_dashboard_accessibility.py
      - name: Retain screenshots and external asset failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dashboard-visual-${{ github.sha }}
          path: dashboard-visual-evidence/
          if-no-files-found: warn
          retention-days: 30
