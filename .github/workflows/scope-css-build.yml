name: Scope build pinned CSS
on:
  push:
    branches: [ui-v2/scope-deployment-acceptance]
    paths:
      - scripts/build_scope_css.cjs
      - src/whaxon/interfaces/web/templates/ui_v2_scope.html
      - .github/workflows/scope-css-build.yml
permissions:
  contents: write
concurrency:
  group: scope-css-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Install pinned compiler
        run: npm install --no-save --ignore-scripts --no-audit --no-fund tailwindcss@3.4.17
      - name: Compile standalone Scope styles
        run: node scripts/build_scope_css.cjs
      - name: Commit generated stylesheet
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/whaxon/interfaces/web/static/scope-v2.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build pinned Scope UI stylesheet'
          git push origin HEAD:ui-v2/scope-deployment-acceptance
