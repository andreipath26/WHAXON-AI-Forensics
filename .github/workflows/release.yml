name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Verify release tag matches package version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          tag_version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if version != tag_version:
              raise SystemExit(
                  f"Refusing release: git tag {tag_version!r} does not match "
                  f"pyproject.toml version {version!r}"
              )
          print(f"Release tag matches package version {version}")
          PY

      - name: Install system deps (pandoc, weasyprint)
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc weasyprint

      - name: Install (core + dev)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[tui,web,dev]"

      - name: Static checks
        run: |
          ruff check src tests
          mypy src

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run test suite
        run: python -m pytest tests/ -q

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Smoke-test the built wheel in a clean environment
        run: |
          set -eu
          python -m venv /tmp/whaxon-release-smoke
          /tmp/whaxon-release-smoke/bin/python -m pip install --upgrade pip
          /tmp/whaxon-release-smoke/bin/python -m pip install dist/*.whl
          /tmp/whaxon-release-smoke/bin/whaxon --help
          /tmp/whaxon-release-smoke/bin/python - <<'PY'
          import json
          from importlib.resources import files

          package = files("whaxon")
          catalog = package.joinpath("data", "tools.json")
          payloads = package.joinpath("data", "payloads")
          assert catalog.is_file(), "wheel is missing whaxon/data/tools.json"
          data = json.loads(catalog.read_text(encoding="utf-8"))
          assert isinstance(data, (dict, list)), "packaged tools catalog has invalid JSON shape"
          assert payloads.is_dir(), "wheel is missing whaxon/data/payloads"
          assert any(payloads.iterdir()), "wheel contains no validation payload files"
          print("Built wheel package-data smoke test passed.")
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
