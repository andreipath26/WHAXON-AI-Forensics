name: Dashboard static CSS vendor

on:
  push:
    branches:
      - ui-v2/dashboard-crosswalk-hardening
    paths:
      - scripts/build_dashboard_css.cjs
      - .github/workflows/dashboard-css-vendor.yml
      - src/whaxon/interfaces/web/templates/ui_v2_dashboard.html

permissions:
  contents: write

concurrency:
  group: dashboard-css-vendor
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Install reproducible Tailwind CLI
        run: npm install --no-save --ignore-scripts --no-audit --no-fund tailwindcss@3.4.17
      - name: Compile pinned Dashboard CSS
        run: node scripts/build_dashboard_css.cjs
      - name: Commit generated CSS only when changed
        run: |
          set -euo pipefail
          if git diff --quiet -- src/whaxon/interfaces/web/static/dashboard-v2.css &&
             test -f src/whaxon/interfaces/web/static/dashboard-v2.css &&
             git ls-files --error-unmatch src/whaxon/interfaces/web/static/dashboard-v2.css >/dev/null 2>&1; then
            echo "Bundled CSS unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/whaxon/interfaces/web/static/dashboard-v2.css
          git commit -m "Build bundled Dashboard Tailwind CSS" || exit 0
          git push origin HEAD:ui-v2/dashboard-crosswalk-hardening
